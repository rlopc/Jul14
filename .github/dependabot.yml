# Weekly, grouped version updates for everything pinned in the repository
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle before adopting them, to dodge compromised versions
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    # PR titles must follow Conventional Commits
    commit-message:
      prefix: ci

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Development tools locked in uv.lock (pre-commit and its plugin)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Dev container images: the base image and uv (FROM lines in the Dockerfile)
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Dev container features
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: build
