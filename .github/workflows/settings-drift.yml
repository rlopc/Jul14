# Report GitHub settings changed outside the repository. Scheduled, not a PR check:
# its result depends on GitHub's state, not on the code under review.
name: Settings drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Reading administration settings needs more than GITHUB_TOKEN can be granted
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-administration: read
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/github-settings.sh check
